name = "classsync"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only API calls run the Worker. Pages, scripts, images and stickers are answered by the static-assets layer,
# which does not count toward the Workers request limit (verify against Cloudflare pricing before launch).
run_worker_first = ["/api/*"]

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "classsync-db"
database_id = "10e6dcd5-52de-41ed-a269-bb625e2d0a1a"


# Daily post expiry and hourly trends cron triggers
[triggers]
crons = ["0 0 * * *", "0 * * * *"]

# Non-secret environment variables
[vars]
ENVIRONMENT = "production"
# Secrets (configure via `npx wrangler secret put <KEY>`):
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - APP_URL
# - ADMIN_SECRET
# - B2_KEY_ID
# - B2_APPLICATION_KEY
# - B2_BUCKET_ID
# - B2_BUCKET_NAME

